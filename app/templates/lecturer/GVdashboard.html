<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Giảng viên - NEU</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neu: { blue: '#00528C', red: '#C41212', yellow: '#FFC101', gray: '#B2B2B2' }
                    },
                    fontFamily: { sans: ['Roboto', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen">
    <header class="bg-neu-red text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded flex items-center justify-center text-neu-red font-bold text-xl shadow-sm">N</div>
                <div>
                    <h1 class="font-bold text-lg uppercase">Cổng Giảng Viên</h1>
                    <p class="text-xs text-white/80">Hệ thống Quản lý Đào tạo</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right hidden md:block">
                    <span class="block font-bold text-sm">GV. Nguyễn Thị Minh</span>
                    <span class="block text-xs text-red-100">Khoa Công nghệ thông tin</span>
                </div>
                <button class="bg-white text-neu-red hover:bg-red-50 font-medium px-4 py-1.5 rounded text-sm transition shadow-sm">
                    Đăng xuất
                </button>
            </div>
        </div>
    </header>
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-sm p-6 mb-8 border-l-4 border-neu-blue flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Xin chào, Cô Minh!</h2>
                <p class="text-gray-500 mt-1">Học kỳ I - Năm học 2025-2026. Cô đang có <span class="font-bold text-neu-red">02</span> lớp học phần cần quản lý.</p>
            </div>
        </div>
        <h3 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Danh sách Lớp học phần</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-lg shadow-sm hover:shadow-lg transition duration-300 border border-gray-200 group">
                <div class="bg-neu-blue p-4 rounded-t-lg flex justify-between items-start">
                    <div>
                        <h4 class="font-bold text-white text-lg">CSDL & Giải thuật</h4>
                        <span class="text-xs bg-white/20 text-white px-2 py-1 rounded inline-block mt-1">Nhóm 01</span>
                    </div>
                    <i class="fas fa-database text-white/30 text-3xl group-hover:text-white/50 transition"></i>
                </div>
                <div class="p-5 space-y-3 text-sm">
                    <div class="flex items-center text-gray-600">
                        <i class="fas fa-clock w-8 text-center text-neu-blue"></i>
                        <span>Thứ 2 (Tiết 1-3)</span>
                    </div>
                    <div class="flex items-center text-gray-600">
                        <i class="fas fa-map-marker-alt w-8 text-center text-neu-red"></i>
                        <span>Phòng 302 - Nhà A2</span>
                    </div>
                    <div class="flex items-center text-gray-600">
                        <i class="fas fa-users w-8 text-center text-neu-yellow"></i>
                        <span>Sĩ số: <span class="font-bold text-gray-800">68/70</span></span>
                    </div>
                    <hr class="my-2 border-gray-100">
                    <div class="flex space-x-2 pt-1">
                        <button class="flex-1 py-2 bg-gray-100 text-gray-700 rounded hover:bg-gray-200 font-medium transition">
                            DS Lớp
                        </button>
                        <button class="flex-1 py-2 bg-neu-red text-white rounded hover:bg-red-700 font-medium transition shadow-sm">
                            Nhập điểm
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
